name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  diagnostics:
    name: Read deployment diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 3
    steps:
      - name: Read PM2 status and sanitized error log
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          eval "$(fnm env --shell bash)"
          fnm use 22
          .venv/bin/python - <<'PY'
          import json, subprocess
          from sqlalchemy.engine import make_url
          from scripts.deploy import settings_from_env, application_environment
          settings = settings_from_env()
          env = application_environment(settings)
          status = subprocess.run(['pm2', 'jlist'], capture_output=True, text=True, env=env, check=True)
          for app in json.loads(status.stdout):
              if app['name'] == 'eskeylation-api':
                  data = app['pm2_env']
                  print(json.dumps({key: data.get(key) for key in ['status', 'pm_exec_path', 'exec_interpreter', 'pm_cwd', 'exit_code', 'restart_time']}))
          logs = subprocess.run(['pm2', 'logs', 'eskeylation-api', '--err', '--lines', '50', '--nostream'], capture_output=True, text=True, env=env, timeout=20)
          output = logs.stdout + logs.stderr
          for value in [settings.database_url, settings.jwt_secret, settings.google_drive_api_key, settings.supabase_service_key, settings.aws_access_key_id, settings.aws_secret_access_key, make_url(settings.database_url).password]:
              if value:
                  output = output.replace(value, '[REDACTED]')
          print(output)
          from pathlib import Path
          import os, re
          # Inspect only for the public domain; never export config text or paths.
          production = []
          paths = set(Path('/etc/nginx').rglob('*.conf')) | set(Path('/etc/nginx/sites-enabled').glob('*'))
          for path in paths:
              try:
                  text = path.read_text()
              except (OSError, UnicodeError):
                  continue
              names = re.findall(r'^\s*server_name\s+([^;]+);', text, re.MULTILINE)
              if any('eskaylation.com' in name.split() for name in names):
                  production.append({
                      'writable': os.access(path, os.W_OK),
                      'has_upgrade_header': bool(re.search(r'proxy_set_header\s+Upgrade\s+\$http_upgrade\s*;', text)),
                      'has_http11': bool(re.search(r'proxy_http_version\s+1\.1\s*;', text)),
                  })
          print('PUBLIC_DOMAIN_PROXY_FLAGS', json.dumps(production))
          check = subprocess.run(['sudo', '-n', 'nginx', '-t'], capture_output=True, timeout=15)
          print('CAN_TEST_NGINX_CONFIG', check.returncode == 0)
          import httpx
          from websockets.sync.client import connect
          response = httpx.get('http://127.0.0.1:8000/api/community', params={'page_size': 1}, timeout=30)
          response.raise_for_status()
          content_id = response.json()['items'][0]['id']
          with connect(f'ws://127.0.0.1:8000/api/community/{content_id}/ws', origin='https://eskaylation.com', open_timeout=20) as websocket:
              websocket.ping().wait(timeout=10)
              print('BACKEND_WEBSOCKET_OK')
          PY

  backend:
    if: github.event_name != 'workflow_dispatch'
    name: Backend — Lint & Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: eskaylation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eskaylation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/eskaylation_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ENVIRONMENT: dev
      PUBLIC_CONTENT_SOURCE: database
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      # --locked: cài đúng uv.lock và kiểm tra lockfile khớp pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Apply database migrations on isolated PostgreSQL
        run: uv run --locked alembic upgrade head

      - name: Unit and integration tests
        run: uv run --locked pytest

      # Audit CVE dependency Python (theo đúng lockfile)
      - name: pip-audit
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt --disable-pip

  frontend:
    if: github.event_name != 'workflow_dispatch'
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: cài đúng theo package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + Build (tsc + vite)
        run: npm run build

      # Chỉ fail khi có CVE mức high trở lên
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Save tested frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3
          if-no-files-found: error

  browser:
    if: github.event_name != 'workflow_dispatch'
    name: Browser — Public & Admin flows
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-browser-password
          POSTGRES_DB: eskaylation_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eskaylation_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-browser-password@localhost:5432/eskaylation_browser_test
      ENVIRONMENT: dev
      JWT_SECRET: isolated-browser-test-secret-never-use-in-production
      PUBLIC_CONTENT_SOURCE: database
      STORAGE_BACKEND: local
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      GOOGLE_DRIVE_API_KEY: ''
      GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install test dependencies and browser
        run: |
          uv sync --locked
          uv run --locked playwright install --with-deps chromium
      - name: Exercise public and admin flows on isolated database
        run: uv run --locked python -m scripts.browser_checks
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .local/browser-checks/
          retention-days: 3

  deploy:
    name: Deploy application
    needs: [backend, frontend, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 20
    concurrency:
      group: eskeylation-deploy
      cancel-in-progress: false
    steps:
      - name: Validate server checkout
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        run: |
          set -eo pipefail
          current_branch=$(git branch --show-current)
          if [ "$current_branch" != main ]; then
            printf 'Deployment requires branch main; server is on %s.\n' "$current_branch" >&2
            exit 1
          fi
          tracked_changes=$(git status --porcelain --untracked-files=no)
          if [ "$tracked_changes" = ' M frontend/package-lock.json' ] && git diff --cached --quiet; then
            backup_dir=".local/deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "$backup_dir"
            cp -p -- frontend/package-lock.json "$backup_dir/package-lock.json"
            cmp --silent -- frontend/package-lock.json "$backup_dir/package-lock.json"
            git diff --binary HEAD -- frontend/package-lock.json > "$backup_dir/package-lock.patch"
            printf 'Saved server lockfile changes to %s; using the tested main lockfile.\n' "$backup_dir"
            git restore --source=HEAD --worktree -- frontend/package-lock.json
            tracked_changes=$(git status --porcelain --untracked-files=no)
          fi
          if [ -n "$tracked_changes" ]; then
            printf 'Deployment stopped: server has uncommitted tracked changes:\n%s\n' "$tracked_changes" >&2
            exit 1
          fi

      - name: Pull tested commit and install runtime dependencies
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          if ! command -v fnm >/dev/null 2>&1; then
            printf 'fnm not found for runner user %s. Add its install directory to PATH.\n' "$(id -un)" >&2
            exit 1
          fi
          fnm_env=$(fnm env --shell bash)
          eval "$fnm_env"
          fnm install 22
          fnm use 22
          for tool in git uv node pm2 curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf 'Missing %s in runner PATH (user=%s, HOME=%s).\n' "$tool" "$(id -un)" "$HOME" >&2
              exit 1
            fi
          done
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          uv sync --locked --no-dev

      - name: Download tested frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/eskaylation-frontend-${{ github.sha }}

      - name: Configure, migrate and restart
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        env:
          FRONTEND_ARTIFACT: ${{ runner.temp }}/eskaylation-frontend-${{ github.sha }}
          DEPLOY_GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          DEPLOY_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_GOOGLE_DRIVE_FOLDER_ID: 1lnfNK-1UMVLrydMHBntY33cLipf4MyFL
          DEPLOY_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          DEPLOY_PUBLIC_CONTENT_SOURCE: ${{ vars.PUBLIC_CONTENT_SOURCE }}
          DEPLOY_STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND }}
          DEPLOY_S3_BUCKET: ${{ vars.S3_BUCKET }}
          DEPLOY_S3_REGION: ${{ vars.S3_REGION }}
          DEPLOY_S3_CDN_URL: ${{ vars.S3_CDN_URL }}
          DEPLOY_S3_KEY_PREFIX: ${{ vars.S3_KEY_PREFIX }}
          DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          eval "$(fnm env --shell bash)"
          fnm use 22
          uv run --no-sync python -m scripts.deploy configure
          uv run --no-sync python -m scripts.check_deploy --database
          uv run --no-sync python -m scripts.deploy migrate
          test -s "$FRONTEND_ARTIFACT/index.html"
          mkdir -p frontend/dist
          cp -a "$FRONTEND_ARTIFACT/." frontend/dist/
          if [ ! -e "$FRONTEND_ARTIFACT/eskaylation_logo.jpg" ]; then
            rm -f -- frontend/dist/eskaylation_logo.jpg
          fi
          uv run --no-sync python -m scripts.deploy restart
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 http://127.0.0.1:8000/health/ready
          pm2 save
