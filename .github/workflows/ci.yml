name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend — Lint & Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: eskaylation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eskaylation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/eskaylation_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ENVIRONMENT: dev
      PUBLIC_CONTENT_SOURCE: database
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # --locked: cài đúng uv.lock và kiểm tra lockfile khớp pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Apply database migrations on isolated PostgreSQL
        run: uv run --locked alembic upgrade head

      - name: Unit and integration tests
        run: uv run --locked pytest

      # Audit CVE dependency Python (theo đúng lockfile)
      - name: pip-audit
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt --disable-pip

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: cài đúng theo package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + Build (tsc + vite)
        run: npm run build

      # Chỉ fail khi có CVE mức high trở lên
      - name: npm audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy application
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 20
    concurrency:
      group: eskeylation-deploy
      cancel-in-progress: false
    steps:
      - name: Pull, install, build and restart on server
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          if ! command -v fnm >/dev/null 2>&1; then
            printf 'fnm not found for runner user %s. Add its install directory to PATH.\n' "$(id -un)" >&2
            exit 1
          fi
          fnm_env=$(fnm env --shell bash)
          eval "$fnm_env"
          fnm install 22
          fnm use 22
          for tool in git uv node npm pm2 curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf 'Missing %s in runner PATH (user=%s, HOME=%s).\n' "$tool" "$(id -un)" "$HOME" >&2
              exit 1
            fi
          done
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          uv sync --locked
          uv run --locked python -m scripts.check_deploy
          npm --prefix frontend ci
          npm --prefix frontend run build
          uv run --locked alembic upgrade head
          pm2 startOrReload ecosystem.config.cjs --only eskeylation-api --update-env
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 http://127.0.0.1:8000/health/ready
