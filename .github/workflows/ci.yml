name: CI/CD

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  diagnostics:
    name: Read deployment diagnostics
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 3
    steps:
      - name: Read PM2 status and sanitized error log
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          eval "$(fnm env --shell bash)"
          fnm use 22
          .venv/bin/python - <<'PY'
          import json, subprocess
          from sqlalchemy.engine import make_url
          from scripts.deploy import settings_from_env, application_environment
          settings = settings_from_env()
          env = application_environment(settings)
          status = subprocess.run(['pm2', 'jlist'], capture_output=True, text=True, env=env, check=True)
          for app in json.loads(status.stdout):
              if app['name'] == 'eskeylation-api':
                  data = app['pm2_env']
                  print(json.dumps({key: data.get(key) for key in ['status', 'pm_exec_path', 'exec_interpreter', 'pm_cwd', 'exit_code', 'restart_time']}))
          logs = subprocess.run(['pm2', 'logs', 'eskeylation-api', '--err', '--lines', '50', '--nostream'], capture_output=True, text=True, env=env, timeout=20)
          output = logs.stdout + logs.stderr
          for value in [settings.database_url, settings.jwt_secret, settings.google_drive_api_key, settings.supabase_service_key, make_url(settings.database_url).password]:
              if value:
                  output = output.replace(value, '[REDACTED]')
          print(output)
          from pathlib import Path
          import re
          for path in sorted(Path('/etc/nginx/sites-enabled').glob('*')):
              if path.is_file():
                  print('NGINX_SITE', str(path), 'TARGET', str(path.resolve()))
                  for number, line in enumerate(path.read_text().splitlines(), 1):
                      if re.match(r'\s*(?:listen|server_name|location|proxy_pass|proxy_http_version|root)\s', line) or re.match(r'\s*proxy_set_header\s+(?:Upgrade|Connection|Host|X-Forwarded-Proto)\s', line):
                          print(f'{number}: {line.strip()}')
          check = subprocess.run(['sudo', '-n', 'nginx', '-t'], capture_output=True, text=True, timeout=15)
          print('NGINX_CONFIG_TEST', check.returncode)
          print(check.stdout + check.stderr)
          PY

  backend:
    if: github.event_name != 'workflow_dispatch'
    name: Backend — Lint & Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: eskaylation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eskaylation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/eskaylation_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ENVIRONMENT: dev
      PUBLIC_CONTENT_SOURCE: database
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # --locked: cài đúng uv.lock và kiểm tra lockfile khớp pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Apply database migrations on isolated PostgreSQL
        run: uv run --locked alembic upgrade head

      - name: Unit and integration tests
        run: uv run --locked pytest

      # Audit CVE dependency Python (theo đúng lockfile)
      - name: pip-audit
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o requirements-ci.txt
          uvx pip-audit -r requirements-ci.txt --disable-pip

  frontend:
    if: github.event_name != 'workflow_dispatch'
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: cài đúng theo package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + Build (tsc + vite)
        run: npm run build

      # Chỉ fail khi có CVE mức high trở lên
      - name: npm audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy application
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 20
    concurrency:
      group: eskeylation-deploy
      cancel-in-progress: false
    steps:
      - name: Validate server checkout
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        run: |
          set -eo pipefail
          current_branch=$(git branch --show-current)
          if [ "$current_branch" != main ]; then
            printf 'Deployment requires branch main; server is on %s.\n' "$current_branch" >&2
            exit 1
          fi
          tracked_changes=$(git status --porcelain --untracked-files=no)
          if [ "$tracked_changes" = ' M frontend/package-lock.json' ] && git diff --cached --quiet; then
            backup_dir=".local/deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "$backup_dir"
            cp -p -- frontend/package-lock.json "$backup_dir/package-lock.json"
            cmp --silent -- frontend/package-lock.json "$backup_dir/package-lock.json"
            git diff --binary HEAD -- frontend/package-lock.json > "$backup_dir/package-lock.patch"
            printf 'Saved server lockfile changes to %s; using the tested main lockfile.\n' "$backup_dir"
            git restore --source=HEAD --worktree -- frontend/package-lock.json
            tracked_changes=$(git status --porcelain --untracked-files=no)
          fi
          if [ -n "$tracked_changes" ]; then
            printf 'Deployment stopped: server has uncommitted tracked changes:\n%s\n' "$tracked_changes" >&2
            exit 1
          fi

      - name: Pull, install, build and restart on server
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          DEPLOY_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_GOOGLE_DRIVE_FOLDER_ID: 1lnfNK-1UMVLrydMHBntY33cLipf4MyFL
          DEPLOY_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          if ! command -v fnm >/dev/null 2>&1; then
            printf 'fnm not found for runner user %s. Add its install directory to PATH.\n' "$(id -un)" >&2
            exit 1
          fi
          fnm_env=$(fnm env --shell bash)
          eval "$fnm_env"
          fnm install 22
          fnm use 22
          for tool in git uv node npm pm2 curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf 'Missing %s in runner PATH (user=%s, HOME=%s).\n' "$tool" "$(id -un)" "$HOME" >&2
              exit 1
            fi
          done
          git fetch origin main
          git merge --ff-only "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          uv sync --locked
          uv run --locked python -m scripts.deploy configure
          uv run --locked python -m scripts.check_deploy --database
          npm --prefix frontend ci
          npm --prefix frontend run build
          uv run --locked python -m scripts.deploy migrate
          uv run --locked python -m scripts.deploy restart
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 http://127.0.0.1:8000/health/ready
          pm2 save
