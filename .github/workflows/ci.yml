name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-unit:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests (không cần DB)
        run: uv run pytest -m "not integration"

  deploy:
    name: Deploy application
    needs: lint-and-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: Default
      labels: [self-hosted, linux, eskaylation]
    timeout-minutes: 20
    concurrency:
      group: eskeylation-deploy
      cancel-in-progress: false
    steps:
      - name: Pull, install, build and restart on server
        shell: bash -l {0}
        working-directory: /home/eskaylation/eskeylation-web
        run: |
          set -eo pipefail
          export PATH="${FNM_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/fnm}:$HOME/.local/bin:$PATH"
          if ! command -v fnm >/dev/null 2>&1; then
            printf 'fnm not found for runner user %s. Add its install directory to PATH.\n' "$(id -un)" >&2
            exit 1
          fi
          fnm_env=$(fnm env --shell bash)
          eval "$fnm_env"
          fnm use default
          for tool in git uv node npm pm2 curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              printf 'Missing %s in runner PATH (user=%s, HOME=%s).\n' "$tool" "$(id -un)" "$HOME" >&2
              exit 1
            fi
          done
          test "$(git branch --show-current)" = main
          git pull --ff-only origin main
          uv sync --locked
          npm --prefix frontend run build
          pm2 restart ecosystem.config.js --only eskeylation-api --update-env
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors \
            --max-time 5 http://127.0.0.1:8000/health
