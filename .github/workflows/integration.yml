name: Integration tests

permissions:
  contents: read

# Test luôn dùng database cô lập; không nhận secrets production.
on:
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: eskaylation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eskaylation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-password@localhost:5432/eskaylation_test
      JWT_SECRET: isolated-ci-test-secret-never-use-in-production
      ENVIRONMENT: dev
      STORAGE_BACKEND: local
      PUBLIC_CONTENT_SOURCE: database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations to isolated database
        run: uv run --locked alembic upgrade head

      - name: Integration tests
        run: uv run --locked pytest -m integration
